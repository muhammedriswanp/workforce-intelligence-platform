name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workforce_test
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Disable Guardrails metrics
        run: printf 'enable_metrics=false\n' > ~/.guardrailsrc

      - name: Run tests
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t workforce-api:test .
        
  retrieval-eval:
    runs-on: ubuntu-latest

    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
      LANGSMITH_TRACING: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Disable Guardrails metrics
        run: printf 'enable_metrics=false\n' > ~/.guardrailsrc
      - name: Run retrieval eval
        run: uv run python -m evals.run_retrieval_eval