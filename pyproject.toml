[project]
name = "workforce-intelligence-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "fastmcp>=4.0.8",
    "guardrails-ai>=0.11.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.12",
    "langsmith>=0.13.0",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.64.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langsmith>=0.13.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
